<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 반을 대표하는 숫자는?</title>
<style>
:root{--bg:#f6f4ff;--card:#fff;--ink:#2d2a4a;--mute:#6f6b8f;--line:#e4e0f5;--pri:#7c6cf0;--prib:#ece9ff;--dot:#9aa5d8;
--c1:#e8743b;--c1b:#ffe8dc;--c2:#3b82d9;--c2b:#dcecff;--c3:#2f9e6b;--c3b:#d9f5e7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171528;--card:#23203b;--ink:#ecebf8;--mute:#a9a6c8;--line:#37335a;--prib:#322d63;--dot:#8591d0;--c1b:#4a2f22;--c2b:#233a57;--c3b:#1f4535;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171528;--card:#23203b;--ink:#ecebf8;--mute:#a9a6c8;--line:#37335a;--prib:#322d63;--dot:#8591d0;--c1b:#4a2f22;--c2b:#233a57;--c3b:#1f4535;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.55}
#app{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:0}h2{font-size:1.15rem;margin:0 0 10px}h3{font-size:1rem;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 4px 14px rgba(124,108,240,.08)}
.tm>.card,.tm .card{border-top:4px solid var(--c1)}.sm .card{border-top:4px solid var(--prib)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.who{font-size:.9rem;color:var(--mute)}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}nav button{flex:1 0 auto;white-space:nowrap}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{border:0;border-radius:14px;padding:9px 16px;background:var(--prib);cursor:pointer;font-weight:600}
button:hover{filter:brightness(.96)}button.pri,nav button.on{background:var(--pri);color:#fff}.tm nav button.on,.tm button.pri{background:var(--c1)}
input,textarea,select{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;width:100%}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1 1 200px!important}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.grid3,.grid2{grid-template-columns:1fr}}
.stat{border-radius:18px;padding:14px}.stat b{font-size:1.7rem;display:block}.stat small{color:var(--mute)}
.s1{background:var(--c1b)}.s2{background:var(--c2b)}.s3{background:var(--c3b)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{display:flex;align-items:center;background:var(--prib);border-radius:14px;padding:2px 4px 2px 2px}
.chip input{width:84px;border:0;background:transparent;text-align:center;padding:6px}.chip button{padding:2px 8px;background:transparent;color:var(--mute)}
.opt{display:block;border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.opt input{width:auto;margin-right:8px}.opt:has(input:checked){border-color:var(--pri);background:var(--prib)}
.badge{display:inline-block;border-radius:10px;padding:2px 10px;font-size:.85rem;font-weight:700}
.b-mean{background:var(--c1b);color:var(--c1)}.b-median{background:var(--c2b);color:var(--c2)}.b-mode{background:var(--c3b);color:var(--c3)}
.tip{background:var(--prib);border-radius:14px;padding:10px 14px;margin:10px 0;font-size:.95rem}
.mute{color:var(--mute);font-size:.9rem}.lock{opacity:.75}
.bar{display:flex;align-items:center;gap:10px;margin:6px 0}.bar>span:first-child{width:56px;font-weight:700}
.bar i{display:block;height:24px;border-radius:12px;min-width:4px;transition:width .3s}
.cm{border-left:3px solid var(--line);padding:2px 10px;margin:8px 0}
.st{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px}.st.on{background:var(--prib)}
.code{font-size:2rem;letter-spacing:.2em;font-weight:800;color:var(--c1)}
table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{padding:7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.svgw{overflow-x:auto}svg{width:100%;min-width:480px;height:auto}svg text{fill:var(--ink);font-size:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--pri);color:#fff;border-radius:16px;padding:10px 18px;display:none;z-index:9;cursor:pointer}#toast.show{display:block}
.login{max-width:460px;margin:6vh auto}.err{color:#d6455d;font-size:.9rem;min-height:1.3em}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" data-act="refresh">👀 새로운 활동이 있어요! 눌러서 확인하기</div>
<script>
/* ===== 데이터 계층(Store) — 실시간 공유·DB 연동 시 이 객체만 교체 =====
   수업 1개 = 문서 1개 {code,pin,title,stage,data,dname,showFirst,students,v1,v2,pres,qs,curq,concl,refl}
   v1(최초 투표)과 v2(재투표)는 서로 다른 필드라 덮어쓰기가 일어나지 않아요.
   ⚠ 지금은 이 기기의 브라우저에만 저장돼요(기기 간 공유·서버 권한 검사는 DB 연동 단계에서). */
let mem={};const K=c=>'rep3:c:'+c;
const Store={
 load(c){try{const r=localStorage.getItem(K(c));return r?JSON.parse(r):(mem[c]||null)}catch(e){return mem[c]||null}},
 save(c,g){mem[c]=g;try{localStorage.setItem(K(c),JSON.stringify(g))}catch(e){}},
 list(){try{return Object.keys(localStorage).filter(k=>k.indexOf('rep3:c:')===0).map(k=>k.slice(7))}catch(e){return Object.keys(mem)}},
 subscribe(fn){addEventListener('storage',e=>{if(e.key&&e.key.indexOf('rep3:c:')===0)fn()})}
};
/* ===== 수학 로직 ===== */
const fmt=x=>String(Math.round(x*100)/100);
function stats(a){
 if(!a.length)return null;if(a.some(v=>typeof v==='string'))return cstats(a);
 const s=[...a].sort((x,y)=>x-y),n=s.length,sum=s.reduce((p,c)=>p+c,0);
 const median=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;
 const f={};s.forEach(v=>f[v]=(f[v]||0)+1);const max=Math.max(...Object.values(f));
 return{s,n,sum,mean:sum/n,median,max,f,modes:max>1?Object.keys(f).filter(k=>f[k]===max).map(Number).sort((x,y)=>x-y):[]};
}
function cstats(a){const f={};a.forEach(v=>f[v]=(f[v]||0)+1);const max=Math.max(...Object.values(f));
 return{cat:true,n:a.length,f,max,modes:max>1?Object.keys(f).filter(k=>f[k]===max):[]}}
(function(){const t=stats([10,15,15,20,20,20,25,30,35,100]);
 console.assert(t.mean===29&&t.median===20&&t.modes.join()==='20','기본 자료 계산 오류');
 console.assert(stats([1,2,3,4]).median===2.5&&stats([1,2,3,4]).modes.length===0,'짝수/최빈값 없음 오류');
 console.assert(stats([1,1,2,2,3]).modes.join()==='1,2','복수 최빈값 오류');
 console.assert(cstats(['가','가','나']).modes.join()==='가','범주형 오류');})();
/* ===== 상수 ===== */
const NAMES={mean:'평균',median:'중앙값',mode:'최빈값'},CH=['mean','median','mode'];
const DESC={mean:'모든 값을 더해 개수로 나눈 값. 모든 자료를 반영해요.',median:'크기순으로 늘어놓았을 때 한가운데 값. 극단값에 덜 흔들려요.',mode:'가장 많이 나타나는 값. 가장 흔한 경우를 보여줘요.'};
const EX=[
 {n:'하루 독서 시간(분)',p:'우리 반 친구들의 ‘보통’ 하루 독서 시간을 소개하는 글을 쓰려고 해요.',d:[10,10,10,15,20,25,30,35,45,100]},
 {n:'신발 치수(mm)',p:'학교 체육관에 공용 신발 대여 코너를 만들려고 해요. 우리 반 친구들이 가장 많이 신는 치수를 가장 넉넉하게 준비해 두려면, 어떤 값을 기준으로 삼으면 좋을까요?',d:[230,230,235,240,240,240,245,250,250,255,260,265,270]},
 {n:'한 달 용돈(천 원)',p:'우리 반 친구들의 용돈 수준을 한 숫자로 소개하려고 해요.',d:[10,10,10,20,30,40,50,50,60,80,300]},
 {n:'수학 퀴즈 점수(점)',p:'우리 반의 수학 퀴즈 성취 수준을 한 숫자로 알려 주려고 해요.',d:[3,5,6,7,7,8,9,9,10,10]},
 {n:'급식 선호 메뉴(학생 20명)',p:'다음 달 급식에 넣을 메뉴 한 가지를 정하는 데 참고하려고 해요.',d:[...Array(7).fill('돈가스'),...Array(5).fill('치킨'),...Array(4).fill('떡볶이'),'비빔밥','비빔밥','생선구이','샐러드']}];
const QS=['이 자료의 활용 목적은 무엇인가요?','왜 ㅇㅇㅇ이 이 자료를 가장 잘 나타내는 대푯값이라고 생각했나요?'];
const STG=['① 자료 탐색','② 최초 투표','③ 결과 확인·발표자 선정','④ 전체 토론·결론 정리','⑤ 재투표','⑥ 결과 공개·성찰'];
const SD=['학생이 자료를 탐색해요. 투표는 잠겨 있어요.','학생이 대표값 하나에 투표해요. (이유 입력 없음)','투표 마감. 결과는 교사만 확인하고 발표자를 정해요.','오프라인 발표 뒤 발문으로 토론하고 학급 결론을 등록해요.','같은 자료로 학생이 다시 투표해요.','전체 변화 결과를 공개하고 학생이 성찰을 써요.'];
const STAB=['📊 자료 탐색실','🗳️ 나의 생각 투표실','🗣️ 발표·토론','📌 우리 반 결론','🔁 다시 투표하기','🌱 나의 생각 변화'];
const TTAB=['🏫 수업·단계 관리','📁 자료 관리','📈 투표 결과·발표자','🧭 토론·학급 결론','🔁 재투표 비교','📝 성찰·데이터'];
/* ===== 유틸·상태 ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tm=t=>new Date(t).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
const pct=(x,n)=>n?Math.round(x/n*100)+'%':'0%';
const badge=c=>`<span class="badge b-${c}">${NAMES[c]}</span>`;
const count=v=>{const c={mean:0,median:0,mode:0};Object.values(v).forEach(x=>c[x.choice]++);return c};
const cbar=(c,n)=>CH.map((k,i)=>`<div class="bar"><span>${NAMES[k]}</span><i style="width:${n?c[k]/n*50:0}%;background:var(--c${i+1})"></i><b>${c[k]}명 (${pct(c[k],n)})</b></div>`).join('');
const cards=sel=>CH.map(c=>`<label class="opt"><input type="radio" name="pick" value="${c}" ${sel===c?'checked':''}>${badge(c)} <span class="mute">${DESC[c]}</span></label>`).join('');
const lockC=(t,m)=>`<div class="card lock"><h2>🔒 ${t}</h2><p>${m}</p></div>`;
const parseNums=t=>t.split(/[\s,]+/).filter(Boolean).map(Number).filter(v=>isFinite(v)&&Math.abs(v)<=1e6);
let S={me:null,tab:0,lm:'s',work:null,msg:''};
try{S.me=JSON.parse(localStorage.getItem('rep3:me'))}catch(e){}
const G=()=>S.me?Store.load(S.me.code):null;
function upd(fn){const g=G();fn(g);Store.save(S.me.code,g);render()}
function setMe(m){S.me=m;S.tab=0;S.work=null;S.msg='';try{m?localStorage.setItem('rep3:me',JSON.stringify(m)):localStorage.removeItem('rep3:me')}catch(e){}}
function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c;do{c='';for(let i=0;i<5;i++)c+=A[Math.floor(Math.random()*A.length)]}while(Store.load(c));return c}
const newC=(code,title,pin)=>({code,pin,title,stage:0,data:[...EX[0].d],dname:EX[0].n,purpose:EX[0].p,showFirst:false,students:{},v1:{},v2:{},pres:[],qs:[...QS],curq:-1,concl:{criteria:'',text:'',ts:0},refl:{}});
function edit(f){if(S.me.role==='t')upd(g=>{const r=f({d:g.data,n:g.dname});g.data=r.d||g.data;g.dname=r.n!==undefined?r.n:g.dname;g.purpose=r.p!==undefined?r.p:g.purpose});else{S.work=Object.assign({},S.work,f(S.work));render()}}
/* ===== 그래프 ===== */
function chart(st){
 const L=30,R=610;let lo=st.s[0],hi=st.s[st.n-1];if(lo===hi){lo-=1;hi+=1}
 const x=v=>L+(v-lo)/(hi-lo)*(R-L),step=Math.min(15,80/st.max);
 let o=`<svg viewBox="0 0 640 215" role="img" aria-label="자료 분포 점도표"><line x1="${L}" x2="${R}" y1="182" y2="182" stroke="var(--line)" stroke-width="2"/>`;
 for(let i=0;i<=5;i++){const v=lo+(hi-lo)*i/5;o+=`<text x="${x(v)}" y="202" text-anchor="middle">${fmt(v)}</text>`}
 for(const k in st.f)for(let i=0;i<st.f[k];i++)o+=`<circle cx="${x(+k)}" cy="${173-i*step}" r="${Math.min(7,step/2+.5)}" fill="var(--dot)"/>`;
 [['mean',[st.mean]],['median',[st.median]],['mode',st.modes]].forEach(([c,vs],k)=>vs.forEach(v=>{
  const px=x(v),y=18+k*15,e=px>R-70;
  o+=`<line x1="${px}" x2="${px}" y1="${y+4}" y2="182" stroke="var(--c${k+1})" stroke-width="2.5" stroke-dasharray="5 3"/><text x="${px+(e?-5:5)}" y="${y}" text-anchor="${e?'end':'start'}" style="fill:var(--c${k+1});font-weight:700">${NAMES[c]} ${fmt(v)}</text>`}));
 return o+'</svg>';
}
/* ===== 자료 탐색(학생=내 연습장, 교사=수업 자료) ===== */
function tbl(st){
 const wrap=t=>`<div class="card"><h2>📋 자료 정리표</h2><div style="max-height:380px;overflow:auto">${t}</div></div>`;
 if(st.cat){const e=Object.entries(st.f).sort((a,b)=>b[1]-a[1]);
  return wrap(`<table><tr><th>메뉴</th><th>인원(도수)</th><th>비율</th><th style="width:35%">막대</th><th>표시</th></tr>${e.map(([k,c])=>`<tr><td>${esc(k)}</td><td>${c}명</td><td>${pct(c,st.n)}</td><td><i style="display:block;height:14px;border-radius:8px;background:var(--dot);width:${c/st.max*100}%"></i></td><td>${st.modes.includes(k)?badge('mode'):''}</td></tr>`).join('')}<tr><th>합계</th><th>${st.n}명</th><th>100%</th><th></th><th></th></tr></table>`)}
 const ks=Object.keys(st.f).map(Number).sort((a,b)=>a-b),n=st.n;let cum=0;
 const lo=n%2?st.s[(n-1)/2]:st.s[n/2-1],hi=n%2?lo:st.s[n/2];
 const mid=i=>n%2?i===(n-1)/2:(i===n/2-1||i===n/2);
 return wrap(`<p class="mute" style="margin-top:0">크기순으로 나열: ${st.s.map((v,i)=>mid(i)?`<span class="badge b-median">${fmt(v)}</span>`:fmt(v)).join(', ')} <br>(파란 칸이 가운데 값이에요)</p>
<table><tr><th>값</th><th>도수(개수)</th><th>누적 도수</th><th style="width:35%">막대</th><th>표시</th></tr>${ks.map(k=>{const c=st.f[k];cum+=c;return`<tr><td><b>${fmt(k)}</b></td><td>${c}개</td><td>${cum}개</td><td><i style="display:block;height:14px;border-radius:8px;background:var(--dot);width:${c/st.max*100}%"></i></td><td>${st.modes.includes(k)?badge('mode')+' ':''}${(k===lo||k===hi)?(lo===hi?badge('median'):'<span class="badge b-median">가운데 값</span>'):''}</td></tr>`}).join('')}<tr><th>합계</th><th>${n}개</th><th></th><th></th><th></th></tr></table>
<p style="margin-bottom:0">모든 값의 합 <b>${fmt(st.sum)}</b> ÷ 개수 <b>${n}</b> = 평균 <b>${fmt(st.mean)}</b></p>`)
}
function exp(d,n,T){
 const st=stats(d);
 let h=`<div class="card"><h2>${T?'수업 자료 관리':'자료 탐색실'}</h2><p class="mute">${T?'여기서 바꾼 자료가 학생 투표의 대상이에요. 투표가 시작된 뒤에는 바꾸지 않는 것을 권장해요.':'여기는 나만의 연습장이에요. 값을 바꾸고 지워 보며 대푯값이 어떻게 달라지는지 살펴보세요. 투표는 수업 자료로 해요.'}</p>
<div class="row"><select class="grow" data-act="ex"><option value="">예시 자료 선택…</option>${EX.map((e,i)=>`<option value="${i}">${e.n}</option>`).join('')}</select><input class="grow" data-act="dname" value="${esc(n)}" aria-label="자료 이름"></div>
<div class="chips">${d.map((v,i)=>`<span class="chip"><input type="${typeof v==='string'?'text':'number'}" step="any" value="${esc(v)}" data-act="cell" data-i="${i}" aria-label="${i+1}번째 값"><button data-act="del" data-i="${i}" title="삭제">✕</button></span>`).join('')}</div>
<div class="row"><input class="grow" id="addn" placeholder="${st&&st.cat?'메뉴 이름 추가 (쉼표로 구분)':'숫자 추가 (여러 개는 쉼표로 구분)'}"><button class="pri" data-act="add">추가</button></div></div>`;
 if(!st)return h+'<div class="card">자료를 입력하면 대푯값이 계산돼요.</div>';
 h+=tbl(st);
 if(st.cat){const e=Object.entries(st.f).sort((a,b)=>b[1]-a[1]);
  return h+`<div class="grid3"><div class="stat s1"><h3>평균</h3><b>계산 불가</b><small>이름은 더할 수 없어요</small></div><div class="stat s2"><h3>중앙값</h3><b>계산 불가</b><small>크기순으로 줄 세울 수 없어요</small></div><div class="stat s3"><h3>최빈값</h3><b>${st.modes.length?st.modes.map(esc).join(', '):'없음'}</b><small>${st.modes.length?st.max+'명이 선택':'모두 한 명씩'}</small></div></div>

<div class="row" style="margin-bottom:12px"><button class="grow ${!T?'pri':''}" data-act="lm" data-m="s">🎒 학생</button><button class="grow ${T?'pri':''}" data-act="lm" data-m="t">🏫 교사</button></div>
${T?`<p><label>수업 코드<input id="code" maxlength="8" autocomplete="off"></label></p>${Store.list().length?`<p class="mute">이 기기의 수업: ${Store.list().map(c=>`<button data-act="fill" data-c="${esc(c)}">${esc(c)}</button>`).join(' ')}</p>`:''}<p><label>교사 PIN<input id="pin" type="password" maxlength="12"></label></p><button class="pri" style="width:100%" data-act="tlogin">교사로 입장</button>
<hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><h3>새 수업 만들기</h3><p><input id="title" maxlength="20" placeholder="수업 이름 (예: 1학년 3반)"></p><p><input id="npin" type="password" maxlength="12" placeholder="교사 PIN (4자 이상)"></p><button style="width:100%" data-act="tnew">수업 생성하고 코드 발급</button>`
:`<p><label>수업 참여 코드<input id="code" maxlength="8" placeholder="선생님이 알려 준 코드" autocomplete="off"></label></p><p><label>나의 별칭<input id="nick" maxlength="10" placeholder="예: 수학왕토끼" autocomplete="off"></label></p><button class="pri" style="width:100%" data-act="login">입장하기</button><p class="mute">같은 별칭으로 다시 들어오면 내 기록이 이어져요.</p>`}
<div class="err" id="err">${esc(S.msg)}</div></div>`;
}
/* ===== 렌더 ===== */
const SV=[sExp,sVote,sDisc,sConcl,sRevote,sChange],TV=[t0,g=>pcard(g)+exp(g.data,g.dname,true),t2,t3,g=>`<div class="card"><h2>최초 투표 vs 재투표</h2>${cmp(g)}</div>`,t5];
function render(){
 const app=$('#app');$('#toast').classList.remove('show');
 let g=G();
 if(S.me&&!g){setMe(null);S.msg='수업을 찾을 수 없어요.'}
 if(S.me&&S.me.role==='s'&&!g.students[S.me.nick]){setMe(null);S.msg='교사가 이 별칭을 삭제했어요. 다시 입장해 주세요.'}
 if(!S.me){app.innerHTML=loginV();return}
 const T=S.me.role==='t',tabs=T?TTAB:STAB;if(S.tab>=tabs.length)S.tab=0;
 app.innerHTML=`<div class="${T?'tm':'sm'}"><div class="top"><div><span class="badge ${T?'b-mean':'b-median'}">${T?'교사용':'학생용'}</span> <h1 style="display:inline">📊 우리 반을 대표하는 숫자는?</h1></div><div class="who">${esc(g.title)} · ${T?'':esc(S.me.nick)+' · '}코드 <b>${esc(g.code)}</b> · ${STG[g.stage]} <button data-act="out">나가기</button></div></div>
<nav>${tabs.map((t,i)=>`<button class="${i===S.tab?'on':''}" data-t="${i}">${t}</button>`).join('')}</nav>${(T?TV:SV)[S.tab](g)}</div>`;
}
/* ===== 이벤트 ===== */
const err=m=>{const e=$('#err');if(e)e.textContent=m};
const pick=()=>{const p=document.querySelector('input[name=pick]:checked');return p?p.value:null};
const val=id=>($('#'+id).value||'').trim();
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-t]');if(t){S.tab=+t.dataset.t;render();return}
 const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT'||b.tagName==='INPUT')return;const a=b.dataset.act,D=b.dataset;
 if(a==='refresh')return render();
 if(a==='lm'){S.lm=D.m;S.msg='';return render()}
 if(a==='fill'){$('#code').value=D.c;return}
 if(a==='login'){const code=val('code').toUpperCase(),nick=val('nick');
  if(!Store.load(code))return err('없는 수업 코드예요. 선생님께 확인해 주세요.');
  if(!nick||/^(__proto__|constructor|prototype)$/.test(nick))return err('사용할 수 있는 별칭을 입력해 주세요.');
  setMe({role:'s',code,nick});return upd(g=>{if(!g.students[nick])g.students[nick]=Date.now()})}
 if(a==='tlogin'){const code=val('code').toUpperCase(),g=Store.load(code);if(!g||g.pin!==val('pin'))return err('수업 코드 또는 PIN이 맞지 않아요.');setMe({role:'t',code});return render()}
 if(a==='tnew'){const pin=val('npin');if(pin.length<4)return err('PIN을 4자 이상 입력해 주세요.');
  const c=genCode();Store.save(c,newC(c,val('title')||'우리 반',pin));setMe({role:'t',code:c});return render()}
 if(a==='out'){setMe(null);return render()}
 if(a==='reset'){S.work=null;return render()}
 if(a==='del'){const i=+D.i;return edit(w=>({d:w.d.filter((_,j)=>j!==i)}))}
 if(a==='add'){const raw=$('#addn').value;return edit(w=>{const cat=w.d.length>0&&typeof w.d[0]==='string';const v=cat?raw.split(',').map(s=>s.trim()).filter(Boolean):parseNums(raw);return{d:w.d.concat(v).slice(0,50)}})}
 if(a==='stage')return upd(g=>{g.stage=Math.max(0,Math.min(5,+D.s))});
 if(a==='rm'){if(!confirm(D.n+' 학생의 모든 기록을 삭제할까요?'))return;return upd(g=>{delete g.students[D.n];delete g.v1[D.n];delete g.v2[D.n];delete g.refl[D.n];g.pres=g.pres.filter(k=>k!==D.n)})}
 if(a==='pres')return upd(g=>{const i=g.pres.indexOf(D.n);if(i>=0)g.pres.splice(i,1);else if(g.pres.length<3)g.pres.push(D.n)});
 if(a==='qadd'){const q=val('qnew');if(q)upd(g=>g.qs.push(q));return}
 if(a==='qdel')return upd(g=>{const i=+D.i;g.qs.splice(i,1);g.curq=g.curq===i?-1:g.curq>i?g.curq-1:g.curq});
 if(a==='qshow')return upd(g=>{g.curq=g.curq===+D.i?-1:+D.i});
 if(a==='saveConcl'){const x=val('ctext');if(x.length<5)return err('결론을 5자 이상 적어 주세요.');return upd(g=>{g.concl={criteria:'',text:x,ts:Date.now()}})}
 if(a==='vote'){const k=D.k,c=pick();if(!c)return err('대표값을 하나 골라 주세요.');
  return upd(g=>{if(g.stage===(k==='v1'?1:4)&&!g[k][S.me.nick])g[k][S.me.nick]={choice:c,ts:Date.now()}})}
 if(a==='saveRefl'){const x=val('ra'),y=val('rb');if(x.length<10||y.length<10)return err('두 칸 모두 10자 이상 써 주세요.');return upd(g=>{g.refl[S.me.nick]={a:x,b:y,ts:Date.now()}})}
 if(a==='copy'){const el=$('#csv');el.focus();el.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}$('#cmsg').textContent=ok?'복사했어요!':'선택됐어요. Ctrl+C(또는 길게 눌러 복사)를 눌러 주세요.'}
});
document.addEventListener('change',e=>{
 const el=e.target,a=el.dataset.act;if(!a)return;
 if(a==='ex'){if(el.value==='')return;const x=EX[+el.value];return edit(()=>({d:[...x.d],n:x.n,p:x.p}))}
 if(a==='dname')return edit(()=>({n:el.value.trim()||'우리 반 자료'}));
 if(a==='cell'){const i=+el.dataset.i;return edit(w=>{const d=[...w.d];if(typeof d[i]==='string'){const s=el.value.trim();if(s)d[i]=s}else{const v=parseFloat(el.value);if(isFinite(v))d[i]=v}return{d}})}
 if(a==='showFirst')return upd(g=>{g.showFirst=el.checked});
 if(a==='purpose')return upd(g=>{g.purpose=el.value.trim()});
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!S.me&&S.lm==='s'){const b=document.querySelector('[data-act=login]');if(b)b.click()}});
Store.subscribe(()=>{if(!S.me)return;const a=document.activeElement;
 if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.value)$('#toast').classList.add('show');else render()});
render();
</script>
</body>
</html>
